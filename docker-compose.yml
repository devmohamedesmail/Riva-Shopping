version: "3"
services:
  laravel-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Laravel_project
    ports:
      - "8080:8080"
    env_file:
      - .env
    depend_on:
      - mysql
    restart: unless-stopped

  mysql:
    build:
      context: contextPath
      dockerfile: Dockerfile
    container_name: mysql_db
    restart: unless-stopped 
    environment:
      - MYSQL_DATABASE : ecommerce
      - MYSQL_ROOT_PASSWORD : root
      - MYSQL_USER : laravel
      - MYSQL_PASSWORD : password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data: /var/lib/mysql    

